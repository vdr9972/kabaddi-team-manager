<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabaddi Tournament Live</title>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg,#071b3a,#245eea);
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    header h2 {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px #0001;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      font-weight: bold;
    }

    button.red { background: #dc2626; }
    button.dark { background: #172033; }
    button.green { background: #16a34a; }

    .controls {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 8px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 12px;
      min-height: 180px;
      object-fit: cover;
    }

    .score {
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      text-align: center;
      align-items: center;
      background: #071b3a;
      color: white;
      border-radius: 15px;
      padding: 20px;
    }

    .score-number {
      font-size: 48px;
      font-weight: bold;
    }

    .status {
      padding: 10px;
      background: #f1f5f9;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    @media(max-width:600px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>🏆 KABADDI TOURNAMENT LIVE</h2>
  <small>4-Camera WebRTC • Live Score</small>
</header>

<div class="container">

  <div class="card">
    <h3>🔴 Live Room</h3>

    <input id="roomName" placeholder="Room name">

    <select id="cameraNo">
      <option value="1">📱 Camera 1</option>
      <option value="2">📱 Camera 2</option>
      <option value="3">📱 Camera 3</option>
      <option value="4">📱 Camera 4</option>
    </select>

    <button onclick="joinLive()">🎥 Join Live</button>

    <div class="controls">
      <button id="cameraBtn" onclick="toggleCamera()">📹 Camera ON</button>
      <button id="micBtn" onclick="toggleMic()">🎤 Mic ON</button>
      <button class="dark" onclick="switchCamera()">🔄 Switch Camera</button>
      <button class="red" onclick="leaveLive()">⛔ Leave Live</button>
    </div>

    <div id="status" class="status">
      Disconnected
    </div>
  </div>

  <div class="card">
    <div class="score">
      <div>
        TEAM A
        <div id="scoreA" class="score-number">0</div>
      </div>

      <div>VS</div>

      <div>
        TEAM B
        <div id="scoreB" class="score-number">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>📺 Live Cameras</h3>

    <div class="video-grid">
      <video id="video1" autoplay playsinline></video>
      <video id="video2" autoplay playsinline></video>
      <video id="video3" autoplay playsinline></video>
      <video id="video4" autoplay playsinline></video>
    </div>
  </div>

</div>

<script>

const {
  Room,
  RoomEvent,
  Track
} = LivekitClient;

let room = null;
let cameraEnabled = false;
let micEnabled = false;
let facingMode = "environment";

async function joinLive() {

  const roomName =
    document.getElementById("roomName").value.trim();

  const cameraNo =
    document.getElementById("cameraNo").value;

  if (!roomName) {
    alert("Room name ಹಾಕಿ");
    return;
  }

  try {

    setStatus("Connecting...");

    const response = await fetch(
      "/api/token",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          room_name: roomName,
          camera_no: cameraNo,
          role: "camera"
        })
      }
    );

    const contentType =
      response.headers.get("content-type") || "";

    if (!contentType.includes("application/json")) {
      const text = await response.text();
      throw new Error(
        "Token server JSON ಬದಲು HTML ಕಳುಹಿಸಿದೆ."
      );
    }

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Token generation failed"
      );
    }

    room = new Room();

    room.on(
      RoomEvent.TrackSubscribed,
      (track) => {

        if (track.kind !== Track.Kind.Video) return;

        const video =
          document.getElementById(
            "video" + cameraNo
          );

        if (video) {
          track.attach(video);
        }
      }
    );

    await room.connect(
      data.serverUrl,
      data.participantToken
    );

    setStatus("🟢 Live Connected");

    await room.localParticipant.setCameraEnabled(true);

    cameraEnabled = true;

    document.getElementById("cameraBtn").innerText =
      "📹 Camera ON";

  } catch (error) {

    console.error(error);

    setStatus("❌ " + error.message);

    alert(error.message);
  }
}


async function toggleCamera() {

  if (!room) {
    alert("ಮೊದಲು Join Live ಒತ್ತಿ");
    return;
  }

  cameraEnabled = !cameraEnabled;

  await room.localParticipant
    .setCameraEnabled(cameraEnabled);

  document.getElementById("cameraBtn").innerText =
    cameraEnabled
      ? "📹 Camera ON"
      : "📷 Camera OFF";
}


async function toggleMic() {

  if (!room) {
    alert("ಮೊದಲು Join Live ಒತ್ತಿ");
    return;
  }

  micEnabled = !micEnabled;

  await room.localParticipant
    .setMicrophoneEnabled(micEnabled);

  document.getElementById("micBtn").innerText =
    micEnabled
      ? "🎤 Mic ON"
      : "🔇 Mic OFF";
}


async function switchCamera() {

  if (!room) {
    alert("ಮೊದಲು Join Live ಒತ್ತಿ");
    return;
  }

  try {

    const publication =
      room.localParticipant
        .getTrackPublication(
          Track.Source.Camera
        );

    if (!publication || !publication.videoTrack) {
      alert("Camera ON ಮಾಡಿ ನಂತರ Switch Camera ಒತ್ತಿ");
      return;
    }

    facingMode =
      facingMode === "environment"
        ? "user"
        : "environment";

    await publication.videoTrack.restartTrack({
      facingMode: facingMode
    });

    setStatus(
      facingMode === "environment"
        ? "📷 Back Camera"
        : "🤳 Front Camera"
    );

  } catch (error) {

    console.error(error);

    alert(
      "Camera switch ಆಗಲಿಲ್ಲ: " +
      error.message
    );
  }
}


function leaveLive() {

  if (room) {
    room.disconnect();
    room = null;
  }

  cameraEnabled = false;
  micEnabled = false;

  document.getElementById("cameraBtn").innerText =
    "📹 Camera ON";

  document.getElementById("micBtn").innerText =
    "🎤 Mic ON";

  setStatus("Disconnected");
}


function setStatus(message) {
  document.getElementById("status").innerText =
    message;
}

</script>

</body>
</html>
