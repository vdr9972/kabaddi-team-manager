<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabaddi Camera</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#071a36;
  color:white;
}
header{
  padding:18px;
  text-align:center;
  background:#1765e8;
}
.box{
  max-width:600px;
  margin:15px auto;
  padding:18px;
  background:white;
  color:#111;
  border-radius:15px;
}
input,select,button{
  width:100%;
  padding:14px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  border:0;
  background:#1765e8;
  color:white;
  font-weight:bold;
}
.green{background:#159447}
.red{background:#d92323}
.orange{background:#f28c00}
video{
  width:100%;
  background:#000;
  border-radius:12px;
  margin-top:10px;
}
.status{
  text-align:center;
  padding:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h2>📹 KABADDI LIVE CAMERA</h2>
<div>Camera Streaming</div>
</header>

<div class="box">

<input
 id="roomName"
 value="kabaddi-live"
 placeholder="Room Name">

<select id="cameraNo">
<option value="1">📹 CAMERA 1</option>
<option value="2">📹 CAMERA 2</option>
<option value="3">📹 CAMERA 3</option>
<option value="4">📹 CAMERA 4</option>
</select>

<button onclick="startCamera()">
🔴 START LIVE CAMERA
</button>

<div id="status" class="status">
🔴 NOT CONNECTED
</div>

<video id="localVideo"
 autoplay
 playsinline
 muted>
</video>

<button
 class="green"
 onclick="cameraOn()">
📹 CAMERA ON
</button>

<button
 class="red"
 onclick="cameraOff()">
⛔ CAMERA OFF
</button>

<button
 class="green"
 onclick="micOn()">
🎤 MIC ON
</button>

<button
 class="red"
 onclick="micOff()">
🔇 MIC OFF
</button>

<button
 class="orange"
 onclick="switchCamera()">
🔄 SWITCH CAMERA
</button>

<button
 class="red"
 onclick="leaveLive()">
🚪 LEAVE LIVE
</button>

</div>

<script>

let room=null;
let videoPublication=null;
let facingMode="environment";


async function startCamera(){

  const roomName =
    document.getElementById("roomName")
    .value.trim();

  const cameraNo =
    document.getElementById("cameraNo")
    .value;

  if(!roomName){
    alert("Room Name enter ಮಾಡಿ");
    return;
  }

  try{

    const response =
      await fetch("/api/token",{

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          room_name:roomName,

          camera_no:cameraNo,

          role:"camera"

        })

      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Token failed"
      );

    }

    room =
      new LivekitClient.Room();

    await room.connect(
      data.serverUrl,
      data.participantToken
    );

    document.getElementById("status")
      .innerText =
      "🟢 CAMERA "+cameraNo+
      " LIVE CONNECTED";

    await room.localParticipant
      .setCameraEnabled(true);

    videoPublication =
      room.localParticipant
      .getTrackPublication(
        LivekitClient.Track.Source.Camera
      );

    const publication =
      room.localParticipant
      .getTrackPublication(
        LivekitClient.Track.Source.Camera
      );

    if(publication &&
       publication.videoTrack){

      publication.videoTrack
        .attach(
          document.getElementById(
            "localVideo"
          )
        );

    }

    /*
      Camera 1 audio ON ಮಾಡಬಹುದು.
      Camera 2-4 default MIC OFF.
    */

    if(cameraNo === "1"){

      await room.localParticipant
        .setMicrophoneEnabled(true);

    }else{

      await room.localParticipant
        .setMicrophoneEnabled(false);

    }

  }catch(error){

    console.error(error);

    document.getElementById("status")
      .innerText =
      "❌ "+error.message;

  }

}


async function cameraOn(){

  if(!room) return;

  await room.localParticipant
    .setCameraEnabled(true);

}


async function cameraOff(){

  if(!room) return;

  await room.localParticipant
    .setCameraEnabled(false);

}


async function micOn(){

  if(!room) return;

  await room.localParticipant
    .setMicrophoneEnabled(true);

}


async function micOff(){

  if(!room) return;

  await room.localParticipant
    .setMicrophoneEnabled(false);

}


async function switchCamera(){

  if(!room) return;

  const publication =
    room.localParticipant
    .getTrackPublication(
      LivekitClient.Track.Source.Camera
    );

  if(!publication ||
     !publication.videoTrack){

    alert("Camera active ಇಲ್ಲ");
    return;

  }

  facingMode =
    facingMode === "environment"
      ? "user"
      : "environment";

  try{

    await publication.videoTrack
      .restartTrack({
        facingMode:facingMode
      });

  }catch(error){

    console.error(error);

    alert(
      "Camera switch ಆಗಲಿಲ್ಲ"
    );

  }

}


async function leaveLive(){

  if(room){

    await room.disconnect();

    room=null;

  }

  document.getElementById("status")
    .innerText =
    "🔴 LIVE ENDED";

  document.getElementById(
    "localVideo"
  ).srcObject=null;

}

</script>

</body>
</html>
