<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabaddi Live</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071a36;
  color:white;
}

header{
  padding:14px;
  text-align:center;
  background:linear-gradient(135deg,#071a36,#1765e8);
}

.live{
  display:inline-block;
  background:#d92323;
  padding:5px 12px;
  border-radius:20px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:12px;
}

.panel{
  background:white;
  color:#111;
  border-radius:15px;
  padding:12px;
  margin-bottom:12px;
}

input,button{
  width:100%;
  padding:13px;
  margin:5px 0;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  border:0;
  background:#1765e8;
  color:white;
  font-weight:bold;
}

.camera-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.camera-box{
  position:relative;
  background:#000;
  min-height:210px;
  border-radius:13px;
  overflow:hidden;
  cursor:pointer;
}

.camera-box.big{
  grid-column:1/-1;
  min-height:500px;
}

.camera-box video{
  width:100%;
  height:100%;
  min-height:210px;
  object-fit:cover;
  display:block;
}

.camera-title{
  position:absolute;
  z-index:5;
  top:8px;
  left:8px;
  background:#d92323;
  padding:5px 9px;
  border-radius:7px;
  font-size:13px;
  font-weight:bold;
}

.waiting{
  min-height:210px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#aaa;
  font-size:18px;
}

.score{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.team{
  background:#071a36;
  color:white;
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.team-name{
  font-size:18px;
  font-weight:bold;
}

.points{
  font-size:48px;
  font-weight:bold;
}

.timer{
  text-align:center;
  font-size:45px;
  font-weight:bold;
  background:#111;
  color:white;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
}

.status{
  text-align:center;
  font-weight:bold;
  padding:7px;
}

@media(max-width:650px){
  .camera-grid{
    grid-template-columns:1fr;
  }

  .camera-box.big{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header>
  <h2>🏆 KABADDI LIVE</h2>
  <div id="liveStatus" class="live">
    🔴 LIVE
  </div>
</header>

<div class="container">

  <div class="panel">

    <input
      id="roomName"
      value="kabaddi-live"
      placeholder="Room Name">

    <button onclick="watchLive()">
      ▶ WATCH LIVE
    </button>

    <div id="status" class="status">
      🔴 NOT CONNECTED
    </div>

  </div>


  <!-- CAMERAS -->

  <div class="panel">

    <div class="camera-grid">

      <div
        class="camera-box"
        id="box1"
        onclick="makeBig(1)">

        <div class="camera-title">
          CAMERA 1
        </div>

        <video
          id="video1"
          autoplay
          playsinline>
        </video>

        <div
          class="waiting"
          id="waiting1">
          Camera 1 Waiting...
        </div>

      </div>


      <div
        class="camera-box"
        id="box2"
        onclick="makeBig(2)">

        <div class="camera-title">
          CAMERA 2
        </div>

        <video
          id="video2"
          autoplay
          playsinline>
        </video>

        <div
          class="waiting"
          id="waiting2">
          Camera 2 Waiting...
        </div>

      </div>


      <div
        class="camera-box"
        id="box3"
        onclick="makeBig(3)">

        <div class="camera-title">
          CAMERA 3
        </div>

        <video
          id="video3"
          autoplay
          playsinline>
        </video>

        <div
          class="waiting"
          id="waiting3">
          Camera 3 Waiting...
        </div>

      </div>


      <div
        class="camera-box"
        id="box4"
        onclick="makeBig(4)">

        <div class="camera-title">
          CAMERA 4
        </div>

        <video
          id="video4"
          autoplay
          playsinline>
        </video>

        <div
          class="waiting"
          id="waiting4">
          Camera 4 Waiting...
        </div>

      </div>

    </div>


    <button onclick="showAll()">
      ▦ SHOW 4 CAMERAS
    </button>

  </div>


  <!-- SCORE -->

  <div class="panel">

    <div class="score">

      <div class="team">

        <div
          class="team-name"
          id="teamA">
          TEAM A
        </div>

        <div
          class="points"
          id="scoreA">
          0
        </div>

      </div>


      <div class="team">

        <div
          class="team-name"
          id="teamB">
          TEAM B
        </div>

        <div
          class="points"
          id="scoreB">
          0
        </div>

      </div>

    </div>


    <div
      class="timer"
      id="timer">
      20:00
    </div>

  </div>

</div>


<script>

let room = null;


/* WATCH LIVE */

async function watchLive(){

  const roomName =
    document
      .getElementById("roomName")
      .value
      .trim();

  if(!roomName){

    alert("Room Name enter ಮಾಡಿ");

    return;
  }


  try{

    const response =
      await fetch("/api/token",{

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          room_name:roomName,

          role:"viewer"

        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Token failed"
      );

    }


    room =
      new LivekitClient.Room();


    /* VIDEO */

    room.on(

      LivekitClient.RoomEvent.TrackSubscribed,

      (track,publication,participant)=>{

        if(track.kind !== "video")
          return;


        const number =
          getCameraNumber(
            participant.identity
          );


        if(!number)
          return;


        const video =
          document.getElementById(
            "video"+number
          );


        const waiting =
          document.getElementById(
            "waiting"+number
          );


        track.attach(video);

        waiting.style.display="none";

        video.style.display="block";

      }

    );


    /* AUDIO */

    room.on(

      LivekitClient.RoomEvent.TrackSubscribed,

      (track)=>{

        if(track.kind === "audio"){

          const audio =
            track.attach();

          audio.autoplay=true;

          document.body
            .appendChild(audio);

        }

      }

    );


    /* MATCH STATE */

    room.on(

      LivekitClient.RoomEvent.DataReceived,

      (payload,participant,kind,topic)=>{

        try{

          const text =
            new TextDecoder()
              .decode(payload);

          const state =
            JSON.parse(text);


          if(state.type !==
             "match_state")
            return;


          updateMatch(state);

        }catch(error){

          console.error(
            "DATA ERROR",
            error
          );

        }

      }

    );


    await room.connect(
      data.serverUrl,
      data.participantToken
    );


    document
      .getElementById("status")
      .innerText =
      "🟢 CONNECTED — WATCHING LIVE";


  }catch(error){

    console.error(error);

    document
      .getElementById("status")
      .innerText =
      "❌ "+error.message;

  }

}


/* CAMERA NUMBER */

function getCameraNumber(identity){

  const match =
    identity.match(
      /Camera[- ]?(\d+)/i
    );

  return match
    ? Number(match[1])
    : null;

}


/* BIG SCREEN */

function makeBig(number){

  for(let i=1;i<=4;i++){

    document
      .getElementById("box"+i)
      .classList
      .remove("big");

  }


  document
    .getElementById("box"+number)
    .classList
    .add("big");

}


/* FOUR SCREENS */

function showAll(){

  for(let i=1;i<=4;i++){

    document
      .getElementById("box"+i)
      .classList
      .remove("big");

  }

}


/* UPDATE SCORE + TIMER */

function updateMatch(state){

  document
    .getElementById("teamA")
    .innerText =
    state.teamA || "TEAM A";


  document
    .getElementById("teamB")
    .innerText =
    state.teamB || "TEAM B";


  document
    .getElementById("scoreA")
    .innerText =
    state.scoreA ?? 0;


  document
    .getElementById("scoreB")
    .innerText =
    state.scoreB ?? 0;


  updateTimer(
    state.seconds ?? 0
  );


  const live =
    document.getElementById(
      "liveStatus"
    );


  live.innerText =
    state.live
      ? "🔴 LIVE"
      : "⚫ OFFLINE";

}


/* TIMER */

function updateTimer(seconds){

  seconds =
    Math.max(
      0,
      Number(seconds) || 0
    );


  const min =
    Math.floor(seconds/60);


  const sec =
    String(seconds%60)
      .padStart(2,"0");


  document
    .getElementById("timer")
    .innerText =
    `${min}:${sec}`;

}

</script>

</body>
</html>
